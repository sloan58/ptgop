name: Approve and merge

# A committee member replies /approve after looking at the preview. This
# workflow is deliberately not Claude — whether to merge is a decision that
# should be mechanical, not judged.
#
# /approve is accepted in two places: on the issue, and on the pull request.
# The issue is the one that matters. Committee members file an issue, get the
# preview link mirrored back to it by preview.yml, and never have to learn what
# a pull request is. The pull request path is for whoever is already in one.

on:
  issue_comment:
    types: [created]

jobs:
  merge:
    if: startsWith(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      # The thread the person actually typed in. Every reply goes back here,
      # because this is the only place they are looking.
      THREAD: ${{ github.event.issue.number }}
    steps:
      - name: Work out which change is being approved
        env:
          IS_PR: ${{ github.event.issue.pull_request != null }}
        run: |
          set -euo pipefail

          if [ "$IS_PR" = "true" ]; then
            pr="$THREAD"
          else
            # Intake names its branches issue-<number>-<slug>, so the change
            # for this issue is the open pull request carrying its number.
            pr=$(gh pr list --repo "$REPO" --state open --json number,headRefName \
              --jq "map(select(.headRefName | startswith(\"issue-$THREAD-\"))) | .[0].number // empty")
          fi

          if [ -z "$pr" ]; then
            gh api "repos/$REPO/issues/$THREAD/comments" -f body="There is no change waiting on this issue, so nothing was published. If it was already approved this is nothing to worry about. If you were expecting something, reply here and someone will take a look."
            exit 1
          fi

          echo "PR=$pr" >> "$GITHUB_ENV"

      - name: Check the approver has write access
        env:
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail

          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq .permission)
          echo "$ACTOR has: $perm"
          if [ "$perm" != "write" ] && [ "$perm" != "admin" ]; then
            gh api "repos/$REPO/issues/$THREAD/comments" -f body="@$ACTOR approvals can only come from committee members with repository access. Nothing has been published."
            exit 1
          fi

      - name: Require checks to be passing
        run: |
          set -euo pipefail

          if ! gh pr checks "$PR" --repo "$REPO"; then
            gh api "repos/$REPO/issues/$THREAD/comments" -f body="The automatic checks on this change have not passed, so nothing was published. If they are still running, reply \`/approve\` again in a minute and it will go through."
            exit 1
          fi

      - name: Merge and publish
        run: |
          set -euo pipefail

          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
          gh api "repos/$REPO/issues/$THREAD/comments" -f body="Approved and published. ptgop.com is updating now — give it a minute, then have a look at the live site. Thanks!"
