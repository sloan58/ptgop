name: Committee issue intake

# Fires when a committee member files one of the issue forms. The forms apply
# their own labels, so nothing here needs a human to label anything.
#
# Who can trigger this is not checked here — claude-code-action requires the
# triggering user to have write access to the repository and rejects bot
# actors, before Claude starts. An issue from anyone else fails the run.

on:
  issues:
    types: [opened]

concurrency:
  group: intake-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  intake:
    if: >
      contains(github.event.issue.labels.*.name, 'pcp') ||
      contains(github.event.issue.labels.*.name, 'ballots')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Ballot PDFs are converted with pdftoppm. The repo's scripts/pdf2png.js
      # does the same thing but is macOS-only, so it can't run here.
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/ptgop-intake"
          claude_args: "--max-turns 40"
